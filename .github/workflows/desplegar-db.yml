name: Desplegar base de datos

# Al fusionar en main una migración o función nueva, se aplica sola en el proyecto Supabase.
# Necesita en GitHub (Settings → Secrets and variables → Actions):
#   variable SUPABASE_PROJECT_ID   y   secreto SUPABASE_ACCESS_TOKEN.
# No hace falta la contraseña de la base: la CLI crea un rol de acceso temporal con el token.
# Mientras no exista la variable, el trabajo se salta.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/functions/**']
  workflow_dispatch:

concurrency: desplegar-db

jobs:
  desplegar:
    if: vars.SUPABASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_ID }}
      - run: supabase migration list
      # Temporal: hay migraciones anteriores a la última aplicada. Quitar tras esta release.
      - run: supabase db push --include-all
      - run: supabase functions deploy
