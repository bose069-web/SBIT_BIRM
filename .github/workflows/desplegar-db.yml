name: Desplegar base de datos

# Al fusionar en main una migración nueva, se aplica sola en el proyecto Supabase.
# Necesita en GitHub (Settings → Secrets and variables → Actions):
#   variable SUPABASE_PROJECT_ID   y   secretos SUPABASE_ACCESS_TOKEN y SUPABASE_DB_PASSWORD.
# Mientras no exista la variable, el trabajo se salta.
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**']
  workflow_dispatch:

concurrency: desplegar-db

jobs:
  desplegar:
    if: vars.SUPABASE_PROJECT_ID != ''
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_ID }}
      - run: supabase migration list
      - run: supabase db push
